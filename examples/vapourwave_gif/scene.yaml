# 0.0 0.0 0.0 0.4
# marble
integrator:
  samples_per_pixel: 200
  step_size: 10
  max_bounces: 5

camera:
  image_width: 800
  aspect_ratio: 1.0
  fov: 6.0
  from: [ 0.0, 1.0, 11.0 ]
  at: [ 0.0, 0.0, 0.0 ]
  v_up: [ 0.0, 1.0, 0.0 ]
  defocus_angle: 0.0
  focus_dist: 10.0

scene:
  bg: 0.0
  meshes: []

  materials:
    light:
      kind: light
      color: [ 15.0, 13.0, 11.0 ]
    dim_light:
      kind: light
      color: [ 0.3, 0.2, 0.1 ]
    marble:
      kind: specular
      color: [ 0.7, 0.55, 0.4 ]
      smoothness: 0.7
      spec_prob: 0.1
    ground:
      kind: noise
      color: [ 0.2, 0.6, 0.8 ]
      scale: 20.0
    gold:
      kind: metal
      color: [ 0.8, 0.6, 0.2 ]
      fuzz: 0.4
    jade:
      kind: metal
      color: [ 0.2, 0.6, 0.8 ]
      fuzz: 0.1
    crystal:
      kind: dielectric
      ref_index: 3.0

  objects:
    - kind: sphere
      material: ground
      center: [ 0.0, -100.5, -1 ]
      r: 100.0
    - kind: sphere
      material: crystal
      center: [ 0.0, -100.5, -1 ]
      r: 100.1

    - kind: sphere
      material: jade
      center: [ 0.0, -100.5, -1 ]
      r: 130.0

    - kind: sphere
      material: dim_light
      center: [ 0.0, -100.5, -11 ]
      r: 90.5
    - kind: sphere
      material: light
      center: [ -3.5, 1.2, 2.2 ]
      r: 1.2
