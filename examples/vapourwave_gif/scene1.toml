# 0.0 0.0 0.0 0.4
# Scene configuration
samples_per_pixel = 200
samples_step_size = 50
max_bounces = 5
image_width = 600
bg = 0.0

# Camera
fov = 4.0
aspect_ratio = 1.0
from = [0.0, 1.0, 11.0]
at = [0.0, 0.0, 0.0]
v_up = [0.0, 1.0, 0.0]

# Debug point view
as_points = false
point_radius = 0.005


# Materials for meshes and objects
[materials.ground]
kind = "noise"
color = [0.2, 0.6, 0.8]
scale = 20.0

[materials.jade]
kind = "metal"
color = [0.2, 0.6, 0.8]
fuzz = 0.1

[materials.light]
kind = "light"
color = [15.0, 13.0, 11.0]

[materials.dim_light]
kind = "light"
color = [0.3, 0.2, 0.1]

[materials.crystal]
kind = "dielectric"
ref_index = 3.0

# Additional scene objects

# ground
[[objects]]
kind = "sphere"
center = [0.0, -100.5, -1.0]
r = 100.0
material = "ground"

[[objects]]
kind = "sphere"
center = [0.0, -100.5, -1.0]
r = 100.1
material = "crystal"

# sky
[[objects]]
kind = "sphere"
center = [0.0, -100.5, -1.0]
r = 130.0
material = "jade"

# lights

[[objects]]
kind = "sphere"
center = [0.0, -100.5, -11.0]
r = 90.5
material = "dim_light"

[[objects]]
kind = "sphere"
center = [-3.5, 1.2, 2.2]
r = 1.2
material = "light"
