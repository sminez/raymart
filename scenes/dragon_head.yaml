integrator:
  samples_per_pixel: 10
  step_size: 10
  max_bounces: 20

camera:
  image_width: 400
  aspect_ratio: 1.0
  fov: 20.0
  from: [ 0.67, 0.18, -1.45 ]
  at: [ 0.436, 0.2, -1 ]
  v_up: [ 0.0, 1.0, 0.0 ]
  defocus_angle: 0.0
  focus_dist: 10.0

scene:
  bg: 0.0

  materials:
    light:
      kind: light
      color: 6.5
    gold:
      kind: metal
      color: [ 0.8, 0.6, 0.2 ]
      fuzz: 0.01
    ground:
      kind: specular
      color: [ 0.8, 0.6, 0.2 ]
      smoothness: 0.5
      spec_prob: 0.2
    silver:
      kind: specular
      color: [ 0.2, 0.3, 0.8 ]
      smoothness: 0.7
      spec_prob: 0.6
    glass:
      kind: dielectric
      ref_index: 1.33

  meshes:
    - path: assets/Dragon_8K.obj
      material: glass
      rotate: -8
      translate: [ 0.0, -0.02, 0.0 ]

  objects:
    - kind: sphere
      material: light
      center: [ -0.2, 0.4, -0.2 ]
      r: 0.2
    - kind: sphere
      material: gold
      center: [ 0.0, -100, -1 ]
      r: 99.7
    - kind: sphere
      material: silver
      center: [ 0.0, -100, -1 ]
      r: 100.9
    - kind: sphere
      material: gold
      center: [ 0.6, 0.2, -0.8 ]
      r: 0.1
