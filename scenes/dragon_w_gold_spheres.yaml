integrator:
  kind: simple
  samples_per_pixel: 1000
  step_size: 25
  max_bounces: 20

camera:
  image_width: 1000
  aspect_ratio: 1.0
  fov: 20.0
  from: [ 1.0, 0.2, -2.85 ]
  at: [ 0.05, 0.05, -0.08 ]
  v_up: [ 0.0, 1.0, 0.0 ]
  defocus_angle: 0.0
  focus_dist: 10.0

scene:
  bg: 0.0

  materials:
    light:
      kind: light
      color: 6.5
    red:
      kind: metal
      color: [ 0.9, 0.2, 0.1 ]
      fuzz: 0.6
    gold:
      kind: metal
      color: [ 0.8, 0.6, 0.2 ]
      fuzz: 0.01
    ground:
      kind: specular
      color: [ 0.8, 0.6, 0.2 ]
      smoothness: 0.5
      spec_prob: 0.2
    silver:
      kind: specular
      color: [ 0.2, 0.3, 0.8 ]
      smoothness: 0.7
      spec_prob: 0.6

  meshes:
    - path: assets/Dragon_8K.obj
      # path: assets/Dragon_80K.obj
      # path: assets/testing/Dragon_800K.obj
      material: red
      rotate: 18.0

  objects:
    - kind: sphere
      material: light
      center: [ 1.4, 0.9, -0.8 ]
      r: 0.7
    - kind: sphere
      material: gold
      center: [ 0.0, -100, -1 ]
      r: 99.7
    - kind: sphere
      material: silver
      center: [ 0.0, -100, -1 ]
      r: 100.6

    - kind: sphere
      material: gold
      center: [ 0.3, -0.1, 0.0 ]
      r: 0.1
    - kind: sphere
      material: gold
      center: [ 0.41, -0.2, -0.5 ]
      r: 0.08
    - kind: sphere
      material: gold
      center: [ 0.42, -0.23, 0.1 ]
      r: 0.07
