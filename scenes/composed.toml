# Scene configuration
samples_per_pixel = 2000
samples_step_size = 10
max_bounces = 50
image_width = 1200
bg = 0.0

# Camera
fov = 10.0
aspect_ratio = 1.6
from = [0.0, 1.0, 11.0]
at = [0.0, 0.0, 0.0]
v_up = [0.0, 1.0, 0.0]

# Debug point view
as_points = false
point_radius = 0.005


# Materials for meshes and objects
[materials.ground]
kind = "checker"
scale = 0.32
even = [0.1, 0.2, 0.07]
odd = 0.9

[materials.red]
kind = "solid"
color = [0.95, 0.15, 0.25]

[materials.dragon]
kind = "specular"
color = [0.6, 0.2, 0.1]
spec_color = [0.1, 0.2, 0.07]
smoothness = 0.6
spec_prob = 0.1

[materials.glass]
kind = "dielectric"
ref_index = 1.33

[materials.crystal]
kind = "dielectric"
ref_index = 3.0

[materials.air]
kind = "dielectric"
ref_index = 0.769

[materials.gold]
kind = "metal"
color = [0.8, 0.6, 0.2]
fuzz = 0.02

[materials.dull_gold]
kind = "metal"
color = [0.8, 0.6, 0.2]
fuzz = 0.06

[materials.jade]
kind = "metal"
color = [0.2, 0.6, 0.8]
fuzz = 0.1

[materials.light]
kind = "light"
color = [5.0, 4.0, 4.0]

[materials.dim_light]
kind = "light"
color = [0.5, 0.4, 0.4]


